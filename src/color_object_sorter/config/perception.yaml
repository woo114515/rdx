color_object_detector:
  ros__parameters:
    image_topic: /csi/image_raw/compressed
    detections_topic: /color_sorter/detections
    debug_topic: /color_sorter/debug/compressed
    health_topic: /color_sorter/perception_health
    image_timeout: 0.5
    debug_fps: 5.0
    debug_jpeg_quality: 65
    roi_top_ratio: 0.10
    morphology_kernel_size: 5
    minimum_area_ratio: 0.001
    maximum_area_ratio: 0.35
    minimum_aspect_ratio: 0.15
    maximum_aspect_ratio: 1.10
    minimum_extent: 0.40
    minimum_solidity: 0.75
    tracker_maximum_distance: 0.25
    tracker_maximum_missed: 3
    colors: [blue, green, red]
    hsv.blue.range_count: 1
    hsv.blue.lower_1: [93, 220, 100]
    hsv.blue.upper_1: [104, 255, 255]
    hsv.green.range_count: 2
    hsv.green.lower_1: [74, 70, 55]
    hsv.green.upper_1: [85, 230, 135]
    hsv.green.lower_2: [63, 73, 52]
    hsv.green.upper_2: [86, 255, 133]
    hsv.red.range_count: 4
    hsv.red.lower_1: [0, 155, 90]
    hsv.red.upper_1: [4, 255, 195]
    hsv.red.lower_2: [170, 155, 90]
    hsv.red.upper_2: [179, 255, 195]
    # Additional dark-red appearance sampled on 2026-09-10. Keep the two
    # accepted ranges above unchanged; these ranges extend rather than replace.
    hsv.red.lower_3: [0, 219, 37]
    hsv.red.upper_3: [8, 255, 109]
    hsv.red.lower_4: [177, 219, 37]
    hsv.red.upper_4: [179, 255, 109]

color_lidar_fusion:
  ros__parameters:
    detections_topic: /color_sorter/detections
    scan_topic: /scan
    output_topic: /color_sorter/localized_objects
    # Static two-point calibration from the 2026-09-06 stationary test.
    center_normalized_x: -0.069
    radians_per_normalized_x: -0.3926990817
    association_half_window: 0.0698131701
    # Similar alternatives within one degree are rejected as ambiguous.
    ambiguity_margin: 0.0174532925
    maximum_scan_age: 0.25
    maximum_range_jump: 0.15
    minimum_cluster_points: 2

temporal_object_confirmation:
  ros__parameters:
    input_topic: /color_sorter/localized_objects
    output_topic: /color_sorter/confirmed_objects
    status_topic: /color_sorter/confirmation_status
    window_seconds: 1.0
    minimum_observations: 6
    minimum_detection_rate: 0.6
    minimum_color_consistency: 0.8
    minimum_lidar_match_rate: 0.5
    maximum_bearing_stddev: 0.0523598776
    maximum_distance_stddev: 0.10
    association_bearing: 0.1047197551
    association_distance: 0.30

cylinder_candidate_validator:
  ros__parameters:
    candidates_topic: /cylinder_snapshot/candidates
    detections_topic: /color_sorter/detections
    output_topic: /cylinder_snapshot/validated_objects
    marker_topic: /cylinder_snapshot/validation_markers
    projection_frame: lidar_link
    center_normalized_x: -0.069
    radians_per_normalized_x: -0.3926990817
    # Stationary 13-point calibration collected on 2026-09-07. The samples
    # span 0.669 rad and 1.589 m; leave-one-out RMSE is 0.0195 normalized-x.
    projection_model: polynomial_range
    projection_coefficients: [0.0156991059397, -2.55105603026, -0.0974005459428, -1.14019421997, -0.0244140933769, -0.198560842383]
    projection_diagnostics_topic: /cylinder_validation/projection_diagnostics
    minimum_normalized_window: 0.08
    normalized_window_padding: 0.03
    # The two-point linear camera/LiDAR projection loses accuracy near image
    # edges. Keep the central window narrow and use 0.14 beyond |x|=0.75.
    edge_window_start: 0.75
    maximum_edge_normalized_window: 0.14
    visual_ambiguity_margin: 0.04
    edge_margin: 0.08
    minimum_color_observations: 5
    minimum_visible_observations: 8
    minimum_color_confidence: 0.65
    # Freeze the first complete configured inventory. This prevents later TF
    # drift or replacement candidate IDs from changing a valid six-object set.
    auto_lock_when_ready: true
    transform_timeout: 0.15
