simple_task_controller:
  ros__parameters:
    # Motion remains opt-in at launch.
    execution_enabled: false
    # Plan one collision-cleared immutable route, then follow it without live
    # obstacle, target-presence, path-deviation, home-proximity, release-drift,
    # SLAM-jump, sensor-timestamp, or phase-timeout vetoes. Loss of the pose
    # required for path tracking and loss of odometry during release still
    # command zero because motion can no longer be computed.
    path_only_mode: true
    fixed_frame: map
    robot_frame: base_footprint
    snapshot_topic: /cylinder_snapshot/validated_objects
    scan_topic: /scan
    odom_topic: /odom
    odom_frame: odom
    cmd_vel_topic: /cmd_vel
    # Motion starts only after the one-time GMapping -> fixed-map AMCL handoff.
    require_fixed_localization: true
    localization_status_topic: /simple_task3/localization_status

    inventory_colors: [blue, green, red]
    inventory_counts: [2, 2, 2]
    # Counts seed the initial detector only. In open mode, every validated
    # object is processed and actual delivered totals drive slot allocation.
    open_inventory_mode: true
    destination_colors: [blue, green, red]
    # Offsets from the first cylinder-group centre in the robot's start axes.
    destinations:
      blue: {x: 0.00, y: 2.00}
      green: {x: 2.00, y: 0.00}
      red: {x: 0.00, y: -2.00}
    destination_slot_spacing: 0.18
    delivered_exclusion_radius: 0.18
    maximum_route_radius: 3.0

    staging_clearance: 0.25
    contact_offset: 0.15
    release_distance: 0.15
    transit_clearance: 0.10

    control_rate: 10.0
    minimum_linear_speed: 0.25
    approach_speed: 0.25
    contact_speed: 0.25
    push_speed: 0.25
    release_speed: 0.25
    return_speed: 0.25
    angular_gain: 3.0
    maximum_angular_speed: 0.50
    heading_tolerance: 0.08
    drive_heading_limit: 0.60
    path_lookahead: 0.30
    maximum_segment_advance: 12

    staging_tolerance: 0.05
    contact_tolerance: 0.035
    push_tolerance: 0.06
    home_tolerance: 0.08
    maximum_path_deviation: 0.12
    maximum_home_error_before_cycle: 0.30
    # Abort instead of chasing a discontinuous SLAM correction.
    maximum_map_position_step: 0.08
    maximum_map_yaw_step: 0.18

    scan_timeout: 0.75
    motion_scan_timeout: 1.0
    odom_timeout: 0.75
    message_stamp_timeout: 1.0
    transform_timeout: 0.10
    transform_failure_limit: 3
    alignment_timeout: 15.0
    approach_timeout: 40.0
    contact_timeout: 15.0
    push_timeout: 60.0
    release_timeout: 10.0
    return_timeout: 50.0
    # Prefer a complete locked inventory, then plan from only the targets that
    # perception has already validated when collection reaches this deadline.
    snapshot_wait_timeout: 5.0
    home_settle_cycles: 3

    target_acquire_distance: 0.65
    target_maximum_distance: 0.32
    target_corridor_half_width: 0.07
    live_obstacle_stop_enabled: false
    obstacle_stop_distance: 0.32
    obstacle_half_width: 0.18
    rear_stop_distance: 0.25
    release_lateral_limit: 0.05
    release_heading_limit: 0.15
